[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mapf"
version = "0.1.0"
description = "Decentralized LLM decision-making for multi-agent path finding on POGEMA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/jev_mapf/maps/LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pogema @ git+https://github.com/Cognitive-AI-Systems/pogema.git@91bbceea20ab5e7fbb44727abb00209bbc759147",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "keyring>=25.6,<26"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
jev-mapf = "jev_mapf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_mapf = ["web/*", "maps/*", "presets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
